<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070509" />
      <stop offset="50%" stop-color="#0e0a16" />
      <stop offset="100%" stop-color="#050308" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c2a4ff" />
      <stop offset="100%" stop-color="#a87cff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Ambient Nebula Blobs -->
  <circle cx="950" cy="180" r="280" fill="#a87cff" opacity="0.12" filter="url(#glow)" />
  <circle cx="250" cy="450" r="220" fill="#7c3aed" opacity="0.08" filter="url(#glow)" />

  <!-- Orbital Rings -->
  <ellipse cx="600" cy="315" rx="480" ry="240" fill="none" stroke="#c2a4ff" stroke-opacity="0.15" stroke-dasharray="10 16" transform="rotate(-10 600 315)" />
  <circle cx="880" cy="210" r="8" fill="#c2a4ff" filter="url(#glow)" />

  <!-- Content Box -->
  <g transform="translate(100, 140)">
    <!-- Pill Badge -->
    <rect width="360" height="42" rx="21" fill="#1b1429" stroke="#c2a4ff" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="28" cy="21" r="5" fill="#10b981" />
    <text x="45" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" letter-spacing="1">AVAILABLE FOR FULL-STACK INTERNSHIPS</text>

    <!-- Main Title -->
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="900" fill="url(#accent-grad)" letter-spacing="-1">ANKIT KUMAR</text>
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="2">FULL-STACK DEVELOPER</text>

    <!-- Subtitle -->
    <text x="0" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#c2a4ff">BCA Student &bull; Graphic Era Deemed to be University</text>
    <text x="0" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="300" fill="#94a3b8">Next.js &bull; React &bull; TypeScript &bull; IndexedDB (PWA) &bull; Supabase &bull; C/C++</text>

    <!-- Footer meta -->
    <text x="0" y="370" font-family="monospace" font-size="16" fill="#c2a4ff" opacity="0.8">github.com/ankitojha16 &bull; ankit.ojha1666@gmail.com &bull; Dehradun, India</text>
  </g>
</svg>
